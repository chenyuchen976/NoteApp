services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20
  # ✅ 修改后：直接删除 JWT_SECRET 行，让 app.py 自动生成 32 字节高强度随机密钥
  web:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
      SECRET_KEY: dev-session-key
      EXPORT_HMAC_KEY_B64: ${EXPORT_HMAC_KEY_B64:?Run python3 scripts/setup_secrets.py first}
      COMMENT_KEY_B64: ${COMMENT_KEY_B64:?Run python3 scripts/setup_secrets.py first}
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host
volumes:
  pgdata: